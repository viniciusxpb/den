<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="3">
  <title>Den Preview — nodes</title>
  <style>
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
.den-viewport {
    width: 1200px;
    min-height: 100vh;
    margin: 0 auto;
}
.den-placeholder {
    /* Marcação visual pra `{{ self.campo }}` quando o preview não tem data real. */
    opacity: 0.7;
    font-style: italic;
}
input {
    font-family: inherit;
    color: inherit;
    background: transparent;
    border: none;
    outline: none;
}

/* ── Page stylesheet (CSS do SCSS da página, incluindo seletor `body`) ── */
.canvas {
    background: #0d0d1a;
    padding: 16px;
    width: 100%;
    height: 100%;
}
.node-row {
    display: flex;
    width: 100%;
}
.node {
    background: #141425;
    border: 1px solid #2a2a4a;
    border-radius: 8px;
    width: 260px;
}
.node-selected {
    border: 2px solid #e94560;
}
.accent {
    padding: 1px;
    border-radius: 8px;
}
.accent-blue {
    background: #4fc3f7;
}
.accent-yellow {
    background: #ffd54f;
}
.accent-green {
    background: #81c784;
}
.accent-red {
    background: #e94560;
}
.node-header {
    background: #1a1a35;
    padding: 10px;
}
.node-title {
    font-size: 13px;
}
.title-blue {
    color: #4fc3f7;
}
.title-yellow {
    color: #ffd54f;
}
.title-green {
    color: #81c784;
}
.title-red {
    color: #e94560;
}
.node-subtitle {
    color: #6a6a8a;
    font-size: 10px;
}
.node-body {
    padding: 20px;
}

  </style>
</head>
<body>
  <div class="den-viewport">
<div class="canvas">
    <div class="node-row">

        !-- Hermes -->
        <div class="node">
            <div class="accent accent-blue"></div>
            <div class="node-header">
                <div class="node-title title-blue">Hermes</div>
                <div class="node-subtitle">Message Router</div>
            </div>
            <div class="node-body"></div>
        </div>

        !-- Atlas -->
        <div class="node">
            <div class="accent accent-yellow"></div>
            <div class="node-header">
                <div class="node-title title-yellow">Atlas</div>
                <div class="node-subtitle">State Manager</div>
            </div>
            <div class="node-body"></div>
        </div>

        !-- Argus -->
        <div class="node">
            <div class="accent accent-green"></div>
            <div class="node-header">
                <div class="node-title title-green">Argus</div>
                <div class="node-subtitle">Monitor</div>
            </div>
            <div class="node-body"></div>
        </div>

        !-- Athena (selected) -->
        <div class="node node-selected">
            <div class="accent accent-red"></div>
            <div class="node-header">
                <div class="node-title title-red">Athena</div>
                <div class="node-subtitle">Decision Engine</div>
            </div>
            <div class="node-body"></div>
        </div>

    </div>
</div>

  </div>
</body>
</html>
