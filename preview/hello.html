<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="3">
  <title>Den Preview — hello</title>
  <style>
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
.den-viewport {
    width: 1200px;
    min-height: 100vh;
    margin: 0 auto;
}
.den-placeholder {
    /* Marcação visual pra `{{ self.campo }}` quando o preview não tem data real. */
    opacity: 0.7;
    font-style: italic;
}
input {
    font-family: inherit;
    color: inherit;
    background: transparent;
    border: none;
    outline: none;
}

/* ── Page stylesheet (CSS do SCSS da página, incluindo seletor `body`) ── */
.page {
    background: #eef8f3;
    padding: 16px;
    width: 100%;
}
.message {
    background: #ffffff;
    border: 1px solid #cfe7db;
    border-radius: 8px;
    padding: 18px;
    color: #15915b;
    font-size: 26px;
    width: 100%;
}

  </style>
</head>
<body>
  <div class="den-viewport">
<div class="page">
    <div class="message">Oi, <span class="den-placeholder">[usuario.nome]</span></div>
</div>

  </div>
</body>
</html>
