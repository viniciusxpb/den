<h1 class="title">Welcome to Den</h1>
<div class="greeting">
    Hello {{ this.name }}, you are {{ this.age }} years old!
</div>

<if cond="this.logged_in">
    <div class="greeting">You are logged in!</div>
</if>
<else>
    <div class="title">Please log in.</div>
</else>

<div class="button" (click)="on_button_click()">Toggle Login</div>

<div class="display__flex">
    <for each="item" in="this.items">
        <div class="button">{{ item }}</div>
    </for>
</div>
